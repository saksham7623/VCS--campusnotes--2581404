<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusNotes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">STUDENT WORKSPACE</p>
      <h1>CampusNotes</h1>
      <p class="subtitle">Capture class notes, keep ideas organized.</p>
    </header>
    <section class="composer" aria-label="Create a note">
      <label for="note-title">Title</label>
      <input id="note-title" maxlength="80" placeholder="e.g. Data Structures — Trees">
      <label for="note-body">Note</label>
      <textarea id="note-body" rows="5" placeholder="Write your notes here..."></textarea>
      <button id="save-note" type="button">Save note</button>
      <p id="message" role="status" aria-live="polite"></p>
    </section>
    <section class="notes-section">
      <div class="section-heading">
        <h2>Your notes</h2>
        <input id="search" type="search" placeholder="Search notes" aria-label="Search notes">
      </div>
      <div id="notes-list" class="notes-list"></div>
      <p id="empty-state">No notes yet. Add your first note above.</p>
    </section>
    <footer>CampusNotes · Your notes stay in this browser.</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
